# cf: https://www.dolthub.com/blog/2021-10-13-how-to-publish-winget-chocolatey-packages-with-github-actions/
name: Recurrent Package Update

run-name: Recurrent CubePDF Utility Package Update

on:
  schedule:
    - cron: "5 3 */4 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  update:
    name: Update CubePDF Utility Package
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Chocolatey Automatic Package Updater Module
        run: choco install chocolatey-au

      - name: Build package
        id: build-package
        working-directory: ./cubepdfutility
        run: |
          $result = (./update.ps1)
          echo "UPDATED=$($result.Updated)" >> "$env:GITHUB_OUTPUT"
          echo "NEW_VERSION=$($result.RemoteVersion)" >> "$env:GITHUB_OUTPUT"
        env:
          au_Push: "false"

      - name: Notify skip
        if: ${{ success() && steps.build-package.outputs.UPDATED != 'True' }}
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## CubePDF Utility Package Build Status for $date"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Current package is up to date.** Will not push it again to Chocolatey."

      - name: Test package installer
        if: ${{ success() && steps.build-package.outputs.UPDATED == 'True' }}
        working-directory: ./cubepdfutility
        run: Test-Package $Install

      - name: Commit & push package update
        if: ${{ success() && steps.build-package.outputs.UPDATED == 'True' }}
        env:
          NEW_VERSION: ${{ steps.build-package.outputs.NEW_VERSION }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Configure commit identity
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we're on a branch (avoids detached HEAD edge cases)
          git checkout -B "$env:REF_NAME"

          # Stage only what you expect to change (matches your typical diff)
          git add -- `
            cubepdfutility/cubepdfutility.nuspec `
            cubepdfutility/tools/chocolateyinstall.ps1

          # If nothing is staged, don't create an empty commit
          $staged = (git diff --staged --name-only)
          if (-not $staged) {
            Write-Host "No changes staged; skipping commit/push."
            exit 0
          }

          # Defense-in-depth: sanitize version for commit message
          $safeVersion = ($env:NEW_VERSION -replace '[^0-9A-Za-z\.\-\+_]', '')
          if ([string]::IsNullOrWhiteSpace($safeVersion)) {
            throw "NEW_VERSION was empty or sanitized to empty. Raw NEW_VERSION='$($env:NEW_VERSION)'."
          }

          git commit -m "[recurrent-package-update] Update CubePDF Utility to $safeVersion"

          # Push using an ephemeral auth header (works with persist-credentials: false)
          $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basicAuth" `
            push origin "HEAD:$env:REF_NAME"

      - name: Push package to Chocolatey
        if: ${{ success() && steps.build-package.outputs.UPDATED == 'True' }}
        run: Push-Package
        working-directory: ./cubepdfutility
        env:
          api_key: ${{ secrets.CHOCOLATEY_API_KEY }}
          au_Push: "true"

      - name: Output results
        if: ${{ success() && steps.build-package.outputs.UPDATED == 'True' }}
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## CubePDF Utility Package Build Status for $date"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("**Package updated to {0}** and pushed to Chocolatey." -f $env:NEW_VERSION)
